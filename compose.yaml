services:
  database:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: complaintops
      POSTGRES_USER: complaintops
      POSTGRES_PASSWORD: complaintops
    ports:
      - "5432:5432"
    volumes:
      - complaintops-postgres:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U complaintops -d complaintops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  complaintops-postgres:

