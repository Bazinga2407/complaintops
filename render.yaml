# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: complaintops
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTH_MODE
        value: oidc
      - key: AGENT_PROVIDER
        value: mock
      - key: DATABASE_URL
        sync: false
      - key: OIDC_ISSUER
        sync: false
      - key: OIDC_CLIENT_ID
        sync: false
      - key: OIDC_CLIENT_SECRET
        sync: false
      - key: OIDC_ADMIN_EMAILS
        sync: false
      - key: SESSION_SECRET
        generateValue: true
